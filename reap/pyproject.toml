[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-reap"
version = "0.1.0"
description = "REAP: rice enhancer activity prediction with Plant DNABERT-6mer"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.2",
  "pandas==2.1.3",
  "torch==2.1.1",
  "transformers==4.36.2",
  "datasets==2.16.1",
  "scikit-learn==1.3.2",
  "peft==0.7.1",
  "accelerate==0.25.0",
  "safetensors==0.4.1",
  "tokenizers==0.15.0",
  "tqdm==4.66.1",
  "sentencepiece==0.1.99",
]

[tool.setuptools.packages.find]
where = ["src"]
